title: "SkylineWebcams World Tour"
views:
  - title: Global Webcams
    icon: mdi:earth
    type: sections
    sections:
      # 1. Kenya - Tsavo East National Park
      - type: grid
        title: Kenya
        cards:
          - type: picture-entity
            entity: camera.kenya_tsavo_east_national_park
            camera_image: camera.kenya_tsavo_east_national_park
            camera_view: live
            fit_mode: contain
            show_name: false
            show_state: false
          - type: markdown
            content: >-
              ## 📍 **{{ state_attr('camera.kenya_tsavo_east_national_park', 'friendly_name') }}**

              _{{ state_attr('camera.kenya_tsavo_east_national_park', 'description') }}_

              **🌍 Country:** {{ state_attr('camera.kenya_tsavo_east_national_park', 'country') }}

              **📌 Region:** {{ state_attr('camera.kenya_tsavo_east_national_park', 'region') }}

              **📍 Place:** {{ state_attr('camera.kenya_tsavo_east_national_park', 'place') }}

              [🔗 View live webcam]({{ state_attr('camera.kenya_tsavo_east_national_park', 'source') }})

