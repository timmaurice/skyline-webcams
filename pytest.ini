[pytest]
# The integration is async throughout, so every async test and fixture is an
# asyncio one. Without this, pytest-asyncio's strict mode leaves the async
# fixtures that pytest-homeassistant-custom-component registers as autouse
# unhandled, and the whole suite errors at setup on a clean checkout.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# No test in this suite has any business taking 30 seconds. Without a bound a
# regression in one of the timeouts under test does not fail - it blocks on the
# sleep it was supposed to interrupt until the CI job is killed, and reports
# nothing at all.
timeout = 30
markers =
    socket: allow socket connections

[pytest-socket]
socket_allowed_hosts = www.skylinewebcams.com,hd-auth.skylinewebcams.com
