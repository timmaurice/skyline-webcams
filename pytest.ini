[pytest]
asyncio_default_fixture_loop_scope = function
markers =
    socket: allow socket connections
# The async cases drive their own event loop, so pytest-asyncio's autouse
# fixture has no async test to attach to. Only relevant when the plugin is
# installed alongside pytest-homeassistant-custom-component.
filterwarnings =
    ignore:.*requested an async fixture 'enable_event_loop_debug'.*:pytest.PytestRemovedIn9Warning
    ignore:coroutine 'enable_event_loop_debug' was never awaited:RuntimeWarning
[pytest-socket]
socket_allowed_hosts = www.skylinewebcams.com,hd-auth.skylinewebcams.com
