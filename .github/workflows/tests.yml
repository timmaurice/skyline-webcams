name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests (offline)
        run: |
          # Run the full test suite offline and capture result for summary
          PYTHONPATH=. pytest custom_components/skylinewebcams/tests > pytest_output.txt 2>&1 || test_exit_code=$?
          cat pytest_output.txt
          echo "### Python Pytest Results" >> $GITHUB_STEP_SUMMARY
          if [ -z "$test_exit_code" ]; then
            echo "✅ All Python tests passed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Python tests failed with exit code $test_exit_code" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -n 5 pytest_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$test_exit_code" ]; then exit $test_exit_code; fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          echo "### Formatting & Linting Checks" >> $GITHUB_STEP_SUMMARY
          if npm run check-format; then
            echo "✅ Code formatting check passed (Prettier)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Code formatting check failed (Prettier)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run linter
        run: |
          if npm run lint; then
            echo "✅ Linter check passed (ESLint)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Linter check failed (ESLint)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run unit tests
        run: |
          npm test > vitest_output.txt 2>&1 || test_exit_code=$?
          cat vitest_output.txt
          echo "### Frontend Unit Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -z "$test_exit_code" ]; then
            echo "✅ All frontend unit tests passed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend unit tests failed!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -n 8 vitest_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$test_exit_code" ]; then exit $test_exit_code; fi

      - name: Build bundle
        run: |
          if npm run build; then
            echo "✅ Lovelace card built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Lovelace card build failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
