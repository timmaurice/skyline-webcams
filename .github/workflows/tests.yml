name: Tests

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

env:
  # The oldest core this job is willing to call a valid run, and so the oldest
  # one hacs.json may declare: HACS must not offer the integration to a core
  # this job never ran against. tests/test_packaging.py holds the two together.
  # See the "Report and check the resolved core" step.
  MINIMUM_CORE: '2026.9.3'

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Home Assistant dropped Python 3.12 after 2025.1.4; 2025.2.0+ need
          # >=3.13 and 2026.3.0+ need >=3.14.2. On 3.12 pip could still satisfy
          # requirements_test.txt - by backtracking all the way to core 2025.1.4
          # - so the suite was green against a core no user runs.
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install "black==25.9.0"

      - name: Report and check the resolved core
        run: |
          # requirements_test.txt pins nothing, and
          # pytest-homeassistant-custom-component pins an *exact* homeassistant.
          # So the core under test is chosen by the resolver, not by this repo,
          # and it can move without a commit. Print it so every run says which
          # core it tested, and fail if the resolver has quietly walked backwards
          # to an older one instead of erroring out.
          python - <<'PY'
          import os
          import sys
          from importlib.metadata import requires, version

          from packaging.requirements import Requirement
          from packaging.version import Version

          core = version("homeassistant")
          phcc = version("pytest-homeassistant-custom-component")
          floor = os.environ["MINIMUM_CORE"]

          print(f"python                                = {sys.version.split()[0]}")
          print(f"homeassistant                         = {core}")
          print(f"pytest-homeassistant-custom-component = {phcc}")
          print(f"minimum core this job accepts         = {floor}")

          failures = []

          if Version(core) < Version(floor):
              failures.append(
                  f"homeassistant {core} is older than the required {floor}. The "
                  "resolver backtracked instead of failing - usually because the "
                  "interpreter is too old for the current core, which makes an "
                  "unsatisfiable pin look like a satisfiable older one."
              )

          # The exact pin is the mechanism behind that backtracking, so name it
          # rather than leaving a mismatch to be puzzled out from two versions.
          pinned = [
              Requirement(r)
              for r in (requires("pytest-homeassistant-custom-component") or [])
              if Requirement(r).name == "homeassistant"
          ]
          for requirement in pinned:
              if not requirement.specifier.contains(core, prereleases=True):
                  failures.append(
                      f"pytest-homeassistant-custom-component {phcc} pins "
                      f"homeassistant{requirement.specifier}, but {core} is installed."
                  )

          if failures:
              print()
              for failure in failures:
                  print(f"error: {failure}")
              raise SystemExit(1)

          print("\nok: testing against the current core.")
          PY

      - name: Check formatting
        run: |
          echo "### 🎨 Python Code Quality" >> $GITHUB_STEP_SUMMARY
          if black --check .; then
            echo "- ✅ **Black**: Python code formatting passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Black**: Python code formatting failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run tests (offline)
        run: |
          # Run tests offline without color codes and save output
          PYTHONPATH=. pytest --color=no tests > pytest_output.txt 2>&1 || test_exit_code=$?
          cat pytest_output.txt

          # Extract summary line (e.g. "5 passed in 0.20s")
          SUMMARY_LINE=$(grep -E "passed|failed" pytest_output.txt | tail -n 1 || echo "Tests completed")

          echo "### 🐍 Python Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -z "$test_exit_code" ]; then
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> **Status**: ✅ All Python tests passed successfully!" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> **Details**: \`$SUMMARY_LINE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **Status**: ❌ Python tests failed with exit code $test_exit_code" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> **Details**: \`$SUMMARY_LINE\`" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>🔍 View Raw Pytest Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

          if [ -n "$test_exit_code" ]; then exit $test_exit_code; fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          echo "### 🎨 Code Quality Checks" >> $GITHUB_STEP_SUMMARY
          if npm run check-format; then
            echo "- ✅ **Prettier**: Code formatting checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Prettier**: Code formatting checks failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run linter
        run: |
          if npm run lint; then
            echo "- ✅ **ESLint**: Code linting check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **ESLint**: Code linting check failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run unit tests
        run: |
          # Run tests with NO_COLOR=true to strip ANSI escapes
          NO_COLOR=true npm test > vitest_output.txt 2>&1 || test_exit_code=$?
          cat vitest_output.txt

          # Extract summary lines
          TEST_FILES_SUMMARY=$(grep "Test Files" vitest_output.txt || echo "")
          TESTS_SUMMARY=$(grep "Tests" vitest_output.txt || echo "")
          DURATION_SUMMARY=$(grep "Duration" vitest_output.txt || echo "")

          echo "### 🧪 Frontend Unit Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -z "$test_exit_code" ]; then
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> **Status**: ✅ All frontend unit tests passed successfully!" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> - $TEST_FILES_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "> - $TESTS_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "> - $DURATION_SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **Status**: ❌ Frontend unit tests failed!" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> - $TEST_FILES_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "> - $TESTS_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "> - $DURATION_SUMMARY" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>🔍 View Raw Vitest Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat vitest_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

          if [ -n "$test_exit_code" ]; then exit $test_exit_code; fi

      - name: Build bundle
        run: |
          if npm run build; then
            echo "- ✅ **Rollup**: Lovelace card built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Rollup**: Lovelace card build failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
