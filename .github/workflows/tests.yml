name: Tests

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install "black==25.9.0"

      - name: Check formatting
        run: |
          echo "### 🎨 Python Code Quality" >> $GITHUB_STEP_SUMMARY
          if black --check .; then
            echo "- ✅ **Black**: Python code formatting passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Black**: Python code formatting failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run tests (offline)
        run: |
          # Run tests offline without color codes and save output
          PYTHONPATH=. pytest --color=no custom_components/skylinewebcams/tests > pytest_output.txt 2>&1 || test_exit_code=$?
          cat pytest_output.txt

          # Extract summary line (e.g. "5 passed in 0.20s")
          SUMMARY_LINE=$(grep -E "passed|failed" pytest_output.txt | tail -n 1 || echo "Tests completed")

          echo "### 🐍 Python Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -z "$test_exit_code" ]; then
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> **Status**: ✅ All Python tests passed successfully!" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> **Details**: \`$SUMMARY_LINE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **Status**: ❌ Python tests failed with exit code $test_exit_code" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> **Details**: \`$SUMMARY_LINE\`" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>🔍 View Raw Pytest Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

          if [ -n "$test_exit_code" ]; then exit $test_exit_code; fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          echo "### 🎨 Code Quality Checks" >> $GITHUB_STEP_SUMMARY
          if npm run check-format; then
            echo "- ✅ **Prettier**: Code formatting checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Prettier**: Code formatting checks failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run linter
        run: |
          if npm run lint; then
            echo "- ✅ **ESLint**: Code linting check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **ESLint**: Code linting check failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run unit tests
        run: |
          # Run tests with NO_COLOR=true to strip ANSI escapes
          NO_COLOR=true npm test > vitest_output.txt 2>&1 || test_exit_code=$?
          cat vitest_output.txt

          # Extract summary lines
          TEST_FILES_SUMMARY=$(grep "Test Files" vitest_output.txt || echo "")
          TESTS_SUMMARY=$(grep "Tests" vitest_output.txt || echo "")
          DURATION_SUMMARY=$(grep "Duration" vitest_output.txt || echo "")

          echo "### 🧪 Frontend Unit Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -z "$test_exit_code" ]; then
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> **Status**: ✅ All frontend unit tests passed successfully!" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> - $TEST_FILES_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "> - $TESTS_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "> - $DURATION_SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **Status**: ❌ Frontend unit tests failed!" >> $GITHUB_STEP_SUMMARY
            echo ">" >> $GITHUB_STEP_SUMMARY
            echo "> - $TEST_FILES_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "> - $TESTS_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "> - $DURATION_SUMMARY" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>🔍 View Raw Vitest Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat vitest_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

          if [ -n "$test_exit_code" ]; then exit $test_exit_code; fi

      - name: Build bundle
        run: |
          if npm run build; then
            echo "- ✅ **Rollup**: Lovelace card built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Rollup**: Lovelace card build failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
