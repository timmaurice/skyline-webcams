name: E2E

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build bundle
        run: npm run build

      - name: Start Home Assistant
        run: docker compose up -d

      - name: Wait for Home Assistant
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8131/manifest.json > /dev/null 2>&1; then
              echo "Home Assistant answered after about $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Home Assistant did not answer on port 8131 within 180s"
          docker compose logs --tail 100
          exit 1

      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show Home Assistant log
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop Home Assistant
        if: always()
        run: docker compose down
