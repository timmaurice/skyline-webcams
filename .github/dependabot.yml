version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'pip'
    directory: '/'
    # The floors in requirements.txt are mirrored into manifest.json, and hassfest rejects a
    # floor above the version Home Assistant pins (beautifulsoup4==4.13.3 in core). Raising them
    # on every release broke validation, so only move a requirement when a release falls outside it.
    versioning-strategy: 'increase-if-necessary'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(deps)'
